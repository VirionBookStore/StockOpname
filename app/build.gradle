plugins { id 'com.android.application' }

android {
    namespace 'com.virion.stockopname'
    compileSdk 35

    defaultConfig {
        applicationId 'com.virion.stockopname'
        minSdk 23
        targetSdk 35
        versionCode System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 1
        versionName "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: "1"}"
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def keyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def keyPassword = System.getenv("ANDROID_KEY_PASSWORD")

    if (keystoreFile && keystorePassword && keyAlias && keyPassword) {
        signingConfigs {
            release {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
                minifyEnabled false
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
}
